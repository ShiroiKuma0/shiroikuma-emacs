# shiroikuma-emacs fork versioning (read by build-fork.sh).
#
# Upstream's own version literals are READ, never edited, so a rebase never conflicts:
#   versionName base  = AC_INIT([GNU Emacs], [<ver>] ...) in configure.ac       (32.0.50 today)
#   versionCode base  = the "Version-code:" trailer comment of java/AndroidManifest.xml.in
#                       (320050000 today; upstream's reserved F-Droid slot for this version --
#                       the manifest's android:versionCode="30" is a placeholder they never move)
#   applicationId     = FORK_APPLICATION_ID in java/Makefile.in (shiroikuma.emacs)
#
# Fork versionName = "<base>+<base commit date>.<HH-MM>.g<sha8>+<BUILD_NUMBER, zero-padded to 3>"
# (global git-versioning skill: the pin is `git merge-base HEAD master`, committer time in UTC);
# versionCode = <Version-code base> + BUILD_NUMBER (plain integer, unpadded).
#
# BUILD_NUMBER is bumped by build-fork.sh after every successful delivered build.  It runs
# MONOTONICALLY and is reset to 1 ONLY when the Version-code base itself moves -- never on a
# sync that merely re-pins the .g<sha>: an installer compares versionCode alone, and the base
# stands still for the whole life of an Emacs major version.  build-fork.sh enforces this
# against LAST_BUILT_VERSION_CODE below.
BUILD_NUMBER=1

# Highest versionCode this repo has ever delivered; build-fork.sh refuses to go at or below it.
LAST_BUILT_VERSION_CODE=0
